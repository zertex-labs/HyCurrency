syntax = "proto3";

package hycurrency;

option java_multiple_files = true;
option java_package = "hycurrency.proto";
option java_outer_classname = "CurrencyProto";

// --- Common Types
message PlayerId {
    string uuid = 1;
}

message Balance {
    string currency_type = 1;
    int64 amount = 2;
}

message Balances {
  repeated Balance entries = 1;
}

// --- Request Messages
message GetBalanceRequest {
    PlayerId player_id = 1;
    string currency_type = 2;
}

message GetAllBalancesRequest {
    PlayerId player_id = 1;
}

// most requests have a "reason" which can be something like: "shop_purchase:bad_api"
// mostly used for "tagging" requests and maybe statistics in the future
message DeductRequest {
    string transaction_id = 1;
    PlayerId player_id = 2;
    string currency_type = 3;
    int64 amount = 4;
    optional string reason = 5;
}

message AddRequest {
    string transaction_id = 1;
    PlayerId player_id = 2;
    string currency_type = 3;
    int64 amount = 4;
    optional string reason = 5;
}

message TransferRequest {
    string transaction_id = 1;
    PlayerId from_player_id = 2;
    PlayerId to_player_id = 3;
    string currency_type = 4;
    int64 amount = 5;
    optional string reason = 6;
}

// -- Response Messages
message GetBalanceResponse {
    oneof result {
        int64 balance = 1;
        PlayerNotFoundError player_not_found = 2;
        ErrorInfo error = 3;
    }
}

message GetAllBalancesResponse {
    oneof result {
        Balances balances = 1;
        PlayerNotFoundError player_not_found = 2;
        ErrorInfo error = 3;
    }
}

message TransactionSuccess {
  string transaction_id = 1;
  int64 new_balance = 2;
  // Amount that could not be applied due to clamping (0 if no clamping occurred)
  // For deduct: remainder when balance would go negative with clamp mode
  // For add: remainder when balance would exceed max_balance with clamp mode
  int64 remainder = 3;
}

message TwoPartyTransactionSuccess {
  string transaction_id = 1;
  int64 sender_new_balance = 2;
  int64 receiver_new_balance = 3;
  // Amount that could not be transferred due to clamping (0 if no clamping occurred)
  // Only applies if sender had insufficient funds with clamp mode
  int64 remainder = 4;
}

message TransactionResponse {
    oneof result {
        TransactionSuccess success = 1;
        InsufficientFundsError insufficient_funds = 2;
        PlayerNotFoundError player_not_found = 3;
        ErrorInfo error = 4;
    }
}

message TwoPartyTransactionResponse {
  oneof result {
    TwoPartyTransactionSuccess success = 1;
    InsufficientFundsError insufficient_funds = 2;
    PlayerNotFoundError sender_not_found = 3;
    ReceiverNotFoundError receiver_not_found = 4;
    ErrorInfo error = 5;
  }
}

// --- Errors
message PlayerNotFoundError {
  PlayerId player_id = 1;
}

message ReceiverNotFoundError {
  PlayerId player_id = 1;
}

message InsufficientFundsError {
    PlayerId player_id = 1;
    string currency_type = 2;
    int64 required = 3;
    int64 available = 4;
}

message ErrorInfo {
    string code = 1;
    optional string message = 2;
}

// --- Services
service CurrencyService {
    rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
    rpc GetAllBalances(GetAllBalancesRequest) returns (GetAllBalancesResponse);
    rpc Deduct(DeductRequest) returns (TransactionResponse);
    rpc Add(AddRequest) returns (TransactionResponse);
    rpc Transfer(TransferRequest) returns (TwoPartyTransactionResponse);
}
