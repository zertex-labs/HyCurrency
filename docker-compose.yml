services:
  postgres:
    image: postgres:17-alpine
    container_name: hycurrency-postgres
    environment:
      POSTGRES_USER: hycurrency
      POSTGRES_PASSWORD: hycurrency_dev
      POSTGRES_DB: hycurrency
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hycurrency -d hycurrency"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: hycurrency-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  hycurrency:
    build: .
    container_name: hycurrency-service
    ports:
      - "50051:50051"
    environment:
      GRPC_PORT: 50051
      GRPC_HOST: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/hycurrency
      DATABASE_USER: hycurrency
      DATABASE_PASSWORD: hycurrency_dev
      DATABASE_MAX_POOL_SIZE: 10
      DATABASE_MIN_IDLE: 2
      REDIS_URL: redis://valkey:6379
      CACHE_BALANCE_TTL_SECONDS: 5
      IDEMPOTENCY_TTL_HOURS: 1
      CURRENCY_CONFIG_PATH: /app/currencies.json
      GRPC_ENABLE_REFLECTION: "true"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  valkey_data:
    driver: local
